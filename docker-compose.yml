version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=FB0o_zt4e3Ziq3LdKDfqNuDdapEastNXvUbLnRearRw=
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__ENABLE_XCOM_PICKLING=true
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/gcp/service_account.json
    - BIGQUERY_PROJECT=${BIGQUERY_PROJECT:-your_project_id}
    - BIGQUERY_LOCATION=${BIGQUERY_LOCATION:-US}
    - BIGQUERY_DATASET_RAW=${BIGQUERY_DATASET_RAW:-raw_movies}
    - BIGQUERY_DATASET_ANALYTICS=${BIGQUERY_DATASET_ANALYTICS:-analytics_movies}
    - AIRBYTE_CONNECTION_ID=${AIRBYTE_CONNECTION_ID:-}
    - AIRFLOW_VAR_AIRBYTE_CONNECTION_ID=${AIRBYTE_CONNECTION_ID:-}
    - AIRFLOW_CONN_AIRBYTE_DEFAULT=http://${AIRBYTE_USERNAME:-airbyte}:${AIRBYTE_PASSWORD:-password}@${AIRBYTE_HOST:-host.docker.internal}:${AIRBYTE_PORT:-8000}
    - DBT_PROFILES_DIR=/opt/airflow/dbt_movies
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./dbt_movies:/opt/airflow/dbt_movies
    - ${GOOGLE_APPLICATION_CREDENTIALS:-./service_account.json}:/opt/airflow/gcp/service_account.json:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    container_name: movie_elt_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: movie_elt_airflow_init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create \
        --username admin \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email admin@example.com \
        --password admin || true
      "
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: movie_elt_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: movie_elt_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:

