version: 2

models:
  - name: mart_movie_performance
    description: >
      Core dimensional mart tracking movie rating performance and financial ROI.
      Consolidated from MovieLens small catalog and TMDB weekly trending financial metrics.
    columns:
      - name: movie_id
        description: Primary key for the movie in the catalog.
        tests:
          - unique
          - not_null

      - name: title
        description: Full movie title as originally cataloged.
        tests:
          - not_null

      - name: clean_title
        description: Normalized movie title stripped of release year suffix.
        tests:
          - not_null

      - name: release_year
        description: Four-digit theatrical release year.
        tests:
          - dbt_utils.accepted_range:
              min_value: 1880
              max_value: 2035
              where: "release_year IS NOT NULL"

      - name: primary_genre
        description: Primary lead genre extracted from the first element of genre_array.
        tests:
          - not_null

      - name: rating_count
        description: Total number of user ratings submitted for this title.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: avg_rating
        description: Arithmetic mean of all user ratings (0.5 to 5.0 scale).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.0
              max_value: 5.0

      - name: bayesian_weighted_score
        description: >
          Bayesian weighted rating score dampening low-volume outliers toward the dataset prior.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.0
              max_value: 5.0

      - name: return_on_investment
        description: >
          Financial return on investment calculated as (revenue - budget) / budget.
          Null if either budget or revenue is unknown.

      - name: financial_status
        description: Financial outcome categorization (Profitable, Loss, Break-Even, No Financial Data).
        tests:
          - not_null
          - accepted_values:
              values: ['Profitable', 'Loss', 'Break-Even', 'No Financial Data']

      - name: rating_tier
        description: Qualitative tier assignment based on rating performance.
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Masterpiece (>=4.5)'
                - 'Acclaimed (4.0 - 4.49)'
                - 'Favorable (3.5 - 3.99)'
                - 'Mixed (2.5 - 3.49)'
                - 'Unfavorable (<2.5)'
                - 'Unrated'

  - name: mart_genre_trends
    description: >
      Aggregated mart tracking movie volume, user sentiment, and profitability
      across genres and release decades.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - genre
            - decade
    columns:
      - name: genre
        description: Movie genre category (e.g., Action, Sci-Fi, Drama).
        tests:
          - not_null

      - name: decade
        description: Release decade expressed as starting year (e.g., 1990, 2000, 2010).
        tests:
          - not_null

      - name: decade_label
        description: Human-readable decade label (e.g., '1990s', '2000s').
        tests:
          - not_null

      - name: total_movies
        description: Distinct count of movies belonging to this genre and decade.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1

      - name: total_ratings
        description: Aggregate volume of ratings submitted for titles in this cohort.
        tests:
          - not_null

      - name: avg_movie_rating
        description: Mean rating across all movies in this genre and decade cohort.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.0
              max_value: 5.0

      - name: avg_bayesian_score
        description: Mean Bayesian weighted score across movies in this cohort.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.0
              max_value: 5.0

